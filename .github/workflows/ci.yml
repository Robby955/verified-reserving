name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build VerifiedReserving

      - name: Verify no sorry or admit
        run: |
          if grep -rnE --include="*.lean" '^[[:space:]]*(sorry|admit)([[:space:]]|$)' VerifiedReserving/ VerifiedReserving.lean; then
            echo "ERROR: sorry or admit found"
            exit 1
          fi

      - name: Verify no custom axioms
        run: |
          if grep -rnE --include="*.lean" '^[[:space:]]*axiom[[:space:]]+' VerifiedReserving/ VerifiedReserving.lean; then
            echo "ERROR: custom axiom found"
            exit 1
          fi

      - name: Axiom audit
        run: |
          lake env lean VerifiedReserving/Test/Axioms.lean | tee axioms_raw.txt
          # Join continuation lines (the pretty-printer wraps long axiom lists).
          sed -e ':a' -e 'N' -e '$!ba' -e 's/\n[[:space:]][[:space:]]*/ /g' axioms_raw.txt > axioms.txt
          # Every audited line must be either the standard three axioms or axiom-free.
          if grep "^'VerifiedReserving" axioms.txt \
             | grep -v -E "depends on axioms: \[propext, Classical.choice, Quot.sound\]$" \
             | grep -v "does not depend on any axioms" | grep -q .; then
            echo "ERROR: a theorem depends on a nonstandard axiom"
            exit 1
          fi
          n=$(grep -c "^'VerifiedReserving" axioms.txt)
          echo "audited declarations: $n"
          test "$n" -ge 479

      # A concrete triangle satisfying the core Mack assumptions (M1), (M3),
      # and (M2'), with representative results instantiated on it.
      - name: Non-vacuity witness
        run: lake env lean VerifiedReserving/Test/Witness.lean
