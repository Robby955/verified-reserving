name: Blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Get Mathlib cache and resolve dev dependencies
        run: lake -Kenv=dev exe cache get

      - name: Build library
        run: lake -Kenv=dev build VerifiedReserving

      - name: Check blueprint declarations exist
        run: lake -Kenv=dev exe checkdecls blueprint/lean_decls

      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pdf2svg dvisvgm texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science latexmk
          pip install leanblueprint

      - name: Build blueprint PDF
        run: leanblueprint pdf

      - name: Build blueprint web
        run: leanblueprint web

      - name: Assemble site
        run: |
          mkdir -p home_page/blueprint
          cp -r blueprint/web/. home_page/blueprint/
          cp blueprint/print/print.pdf home_page/blueprint.pdf
          cp blueprint/index.html home_page/index.html

      # Publish into gh-pages, keeping the docs/ directory that the weekly
      # API-docs workflow maintains.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: home_page
          keep_files: true
