name: Docs and blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Get Mathlib cache and resolve dev dependencies
        run: lake -Kenv=dev exe cache get

      - name: Build library
        run: lake -Kenv=dev build VerifiedReserving

      - name: Check blueprint declarations exist
        run: lake -Kenv=dev exe checkdecls blueprint/lean_decls

      - name: Build API docs
        run: lake -Kenv=dev build VerifiedReserving:docs

      - name: Install blueprint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pdf2svg dvisvgm texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science latexmk
          pip install leanblueprint

      - name: Build blueprint PDF
        run: leanblueprint pdf

      - name: Build blueprint web
        run: leanblueprint web

      - name: Assemble site
        run: |
          mkdir -p home_page/docs home_page/blueprint
          cp -r .lake/build/doc/. home_page/docs/
          cp -r blueprint/web/. home_page/blueprint/
          cp blueprint/print/print.pdf home_page/blueprint.pdf || true
          cp blueprint/index.html home_page/index.html || cp home_page/blueprint/index.html home_page/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: home_page

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
